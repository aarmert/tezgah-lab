# Smoke test: does the firmware flash and boot, and does it answer the basic commands?
name = "smoke"
description = "Flash the firmware, see the boot message, check that it answers the basic commands."
firmware = "firmware/build/stm32bench-fw.elf"

[[step]]
action = "flash"

[[step]]
action = "reset"

[[step]]
name = "boot message"
action = "expect"
pattern = '^BOOT stm32bench-fw v\d+\.\d+\.\d+'
timeout = 3

[[step]]
action = "send"
text = "PING"
expect = '^PONG$'
timeout = 1

[[step]]
action = "send"
text = "VER"
expect = '^VER (\d+\.\d+\.\d+)$'

# Numeric range example: is the time since boot reasonable?
[[step]]
action = "send"
text = "TICK"
expect = '^TICK (\d+)$'
range = [1, 600000]

[[step]]
action = "send"
text = "UID"
expect = '^UID [0-9A-F]{24}$'

[[step]]
action = "send"
text = "LED O ON"
expect = '^OK LED O ON$'

[[step]]
action = "send"
text = "LED O OFF"
expect = '^OK LED O OFF$'

# Does an unknown command return the right error?
[[step]]
action = "send"
text = "FOO"
expect = '^ERR unknown command$'
