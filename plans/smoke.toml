# Duman testi: firmware yüklenip açılıyor mu, temel komutlara cevap veriyor mu?
name = "smoke"
description = "Firmware'i yükle, açılış mesajını gör, temel komutlara cevap veriyor mu kontrol et."
firmware = "firmware/build/stm32bench-fw.elf"

[[step]]
action = "flash"

[[step]]
action = "reset"

[[step]]
name = "açılış mesajı"
action = "expect"
pattern = '^BOOT stm32bench-fw v\d+\.\d+\.\d+'
timeout = 3

[[step]]
action = "send"
text = "PING"
expect = '^PONG$'
timeout = 1

[[step]]
action = "send"
text = "VER"
expect = '^VER (\d+\.\d+\.\d+)$'

# Sayısal aralık örneği: açılıştan beri geçen süre makul mü?
[[step]]
action = "send"
text = "TICK"
expect = '^TICK (\d+)$'
range = [1, 600000]

[[step]]
action = "send"
text = "UID"
expect = '^UID [0-9A-F]{24}$'

[[step]]
action = "send"
text = "LED O ON"
expect = '^OK LED O ON$'

[[step]]
action = "send"
text = "LED O OFF"
expect = '^OK LED O OFF$'

# Bilinmeyen komuta doğru hata dönüyor mu?
[[step]]
action = "send"
text = "FOO"
expect = '^ERR unknown command$'
