# Internal measurement test: the board's own measurements, no extra instruments.
# VDD: supply voltage from VREFINT + factory calibration (the Discovery runs at 3.0 V).
# TEMP: internal temperature sensor (chip temperature, a few degrees above room temperature).
# clock_check: the board's ms counter is compared with the PC clock (is SysTick/HSI right?).
name = "measure"
description = "Check that the internal VDD and TEMP readings are in range and that the board clock matches the PC clock."
firmware = "firmware/build/stm32bench-fw.elf"

[[step]]
action = "flash"

[[step]]
action = "reset"

[[step]]
name = "boot message"
action = "expect"
pattern = '^BOOT stm32bench-fw v\d+\.\d+\.\d+'
timeout = 3

[[step]]
name = "supply voltage (mV)"
action = "send"
text = "VDD"
expect = '^VDD (\d+)$'
range = [2850, 3150]

[[step]]
name = "chip temperature (°C)"
action = "send"
text = "TEMP"
expect = '^TEMP (-?\d+(?:\.\d+)?)$'
range = [15, 60]

[[step]]
name = "board clock / PC clock"
action = "clock_check"
seconds = 5
range = [0.97, 1.03]
