# Çökme ve kurtarma testi: tezgahın kendisini sınar.
# Firmware bilerek HardFault'a düşer; tezgah çökme raporunu okumalı,
# kartın sustuğunu görmeli ve reset ile kartı geri getirebilmeli.
name = "crash_recovery"
description = "Bilerek HardFault oluştur, raporun geldiğini ve resetle kartın kurtulduğunu doğrula."
firmware = "firmware/build/stm32bench-fw.elf"

[[step]]
action = "flash"

[[step]]
name = "yükleme sonrası açılış"
action = "expect"
pattern = '^BOOT '
timeout = 3

[[step]]
name = "çökme raporu"
action = "send"
text = "CRASH"
expect = '^HARDFAULT pc=0x[0-9A-F]{8} lr=0x[0-9A-F]{8} cfsr=0x00010000'
timeout = 1

[[step]]
name = "çöktükten sonra komut"
action = "send"
text = "PING"

[[step]]
name = "kart susmalı"
action = "silence"
seconds = 1

[[step]]
action = "reset"

[[step]]
name = "resetten sonra açılış"
action = "expect"
pattern = '^BOOT '
timeout = 3

[[step]]
name = "kart tekrar cevap veriyor"
action = "send"
text = "PING"
expect = '^PONG$'
