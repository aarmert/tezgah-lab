# Crash and recovery test: tests the bench itself.
# The firmware triggers a HardFault on purpose; the bench must read the crash report,
# see that the board went silent, and bring it back with a reset.
name = "crash_recovery"
description = "Trigger a HardFault on purpose, check that the report arrives and that a reset recovers the board."
firmware = "firmware/build/stm32bench-fw.elf"

[[step]]
action = "flash"

[[step]]
name = "boot after flashing"
action = "expect"
pattern = '^BOOT '
timeout = 3

[[step]]
name = "crash report"
action = "send"
text = "CRASH"
expect = '^HARDFAULT pc=0x[0-9A-F]{8} lr=0x[0-9A-F]{8} cfsr=0x00010000'
timeout = 1

[[step]]
name = "command after the crash"
action = "send"
text = "PING"

[[step]]
name = "board must be silent"
action = "silence"
seconds = 1

[[step]]
action = "reset"

[[step]]
name = "boot after reset"
action = "expect"
pattern = '^BOOT '
timeout = 3

[[step]]
name = "board responds again"
action = "send"
text = "PING"
expect = '^PONG$'
