# Kamera testi: yeşil LED'in yanıp sönme frekansı telefon kamerasıyla sayısal olarak ölçülür.
# Video ve LED bölgesi işaretli kare her adımda rapor klasörüne kaydedilir (cam_stepNN.mp4, cam_stepNN_roi.jpg).
# LED bölgesi otomatik bulunur (parlaklığı en çok değişen yer); bench.toml [camera] roi ile sabitlenebilir.
name = "camera_blink"
description = "BLINK 1/2/4 frekanslarını kamerayla ölç, LED G ON sonrası LED'in sabit yandığını doğrula."
firmware = "firmware/build/stm32bench-fw.elf"

[[step]]
action = "flash"

[[step]]
name = "açılış mesajı"
action = "expect"
pattern = '^BOOT stm32bench-fw v\d+\.\d+\.\d+'
timeout = 3

[[step]]
action = "send"
text = "BLINK 1"
expect = '^OK BLINK 1$'

[[step]]
name = "kamera: 1 Hz"
action = "cam_blink"
seconds = 5
range = [0.9, 1.1]

[[step]]
action = "send"
text = "BLINK 2"
expect = '^OK BLINK 2$'

[[step]]
name = "kamera: 2 Hz"
action = "cam_blink"
seconds = 4
range = [1.8, 2.2]

[[step]]
action = "send"
text = "BLINK 4"
expect = '^OK BLINK 4$'

[[step]]
name = "kamera: 4 Hz"
action = "cam_blink"
seconds = 4
range = [3.6, 4.4]

[[step]]
action = "send"
text = "LED G ON"
expect = '^OK LED G ON$'

[[step]]
name = "kamera: LED sabit yanıyor"
action = "cam_blink"
seconds = 3
steady = "on"
