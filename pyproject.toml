[project]
name = "tezgah"
version = "0.1.0"
description = "STM32 test benches: bench.py (F407) and the bootloader stress tool (C031)"
readme = "README.md"
# bench.py needs 3.11 (tomllib); the stress tool needs 3.12.
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
# cam_blink step in bench.py
camera = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]
# stress/plot.py
plot = [
    "matplotlib>=3.8",
]
# docs/egitim PDF generators
docs = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "pymupdf>=1.24",
    "reportlab>=4.1",
]
# ESP32 flashing/REPL tools for the human (agents must not upload, see AGENTS.md)
esp32 = [
    "esptool>=4.7",
    "mpremote>=1.22",
]
dev = [
    "ruff>=0.6",
]

[tool.uv]
# Scripts run from the repo root (python bench.py, python -m stress); nothing to build or install.
package = false
# Plain `uv sync` installs every group, so it never strips camera/docs/esp32 tools from .venv.
default-groups = "all"

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = ["E4", "E7", "E9", "F"]
extend-exclude = ["node_modules", "camera", "firmware/build", "firmware/boot/build", "firmware/boot_c0/build"]
