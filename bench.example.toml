# tezgah config file
# Copy this file to "bench.toml" and edit it for your computer.
# Relative paths are relative to the folder of this file.

[bench]
name = "discovery-1"

[probe]
# "openocd" (apt install on Ubuntu), "cubeprog" (STM32CubeProgrammer CLI) or "sim" (simulated board)
backend = "openocd"

# If it is not found, give the full path:
# Windows: cubeprog_path = 'C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe'
# Linux:   cubeprog_path = "/opt/st/stm32cubeclt_1.22.0/STM32CubeProgrammer/bin/STM32_Programmer_CLI"

# Which ST-Link to use if more than one is plugged in (bench.py doctor shows the serial number):
# serial_number = "066DFF..."

# NORMAL is enough in most cases. Recovery always connects under reset (UR).
connect_mode = "NORMAL"
timeout_s = 90

# OpenOCD settings (these are right for the STM32F4 Discovery)
openocd_interface = "interface/stlink.cfg"
openocd_target = "target/stm32f4x.cfg"

[serial]
# The USB-TTL adapter's port. Find it with "python bench.py ports".
# Linux: a persistent name is recommended, e.g. "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A50285BI-if00-port0"
#        (otherwise "/dev/ttyUSB0")
# Windows: "COM5"
port = "/dev/ttyUSB0"
baud = 115200

[recovery]
# Known-good firmware flashed under reset if the board locks up
golden_image = "firmware/build/stm32bench-fw.elf"
# The line that shows the board has booted (regex)
banner = '^BOOT '
banner_timeout_s = 3

[permissions]
allow_flash = true
allow_reset = true
# When true, only plans in the plans/ folder can run (an agent cannot make up its own plan)
plans_dir_only = false

[paths]
plans_dir = "plans"
runs_dir = "runs"

# [camera]
# Phone camera for the cam_blink step (camera/ folder). All optional; the defaults:
# tool_dir = "camera"        # relative to the folder of this file
# bun = "~/.bun/bin/bun"
# serial = ""          # if empty, the only connected adb device is used
# camera = "back"
# fps = 30
# roi = [733, 778, 30, 30]   # LED region [x, y, width, height]; found automatically if not given
