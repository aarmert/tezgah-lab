# Bench config for the NUCLEO-C031C6 (+ ESP32-S3 bridge) bench (public/stress/SPEC-C031C6.md 10).
# Copy to bench-c031.toml (gitignored) and fill in the serial numbers. bench.toml stays the F407's.
# `python -m stress ... --target c031` uses bench-c031.toml automatically ([c031] bench_config in
# stress.toml, or --config). Relative paths are from this file's folder.

[bench]
name = "nucleo-c031c6-1"

[probe]
backend = "openocd"
# STM32C0 support is newer than OpenOCD 0.12.0: use the build from git (SPEC-C031C6 11.1).
openocd_path = "~/.local/openocd-git/bin/openocd"
openocd_interface = "interface/stlink.cfg"
openocd_target = "target/stm32c0x.cfg"
# The Nucleo's on-board ST-LINK; set it when more than one ST-Link is plugged in (the F407 bench):
# serial_number = "066B..."
connect_mode = "NORMAL"
timeout_s = 90

[serial]
# The ST-LINK virtual COM port (USART2 PA2/PA3): the witness in --link esp, the link in --link vcp.
# ls /dev/serial/by-id/ | grep STMicroelectronics
port = "/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_<serial>-if02"
baud = 115200

[recovery]
golden_image = "firmware/boot_c0/build/images/golden_ab.hex"
banner = '^BOOT '
banner_timeout_s = 3

[permissions]
allow_flash = true
allow_reset = true
plans_dir_only = false

[paths]
plans_dir = "plans"
runs_dir = "runs"
